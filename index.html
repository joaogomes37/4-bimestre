
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cyber - Loja de produtos de informática.">
  <title>Cyber — Início</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="stlye.css">
  <script src="script.js" defer></script>
</head>

<body>
  <nav class="navbar navbar-expand-md">
    <div class="container">
      <a class="navbar-brand" href="index.html">Cyber</a>

      <div class="navbar-nav">
        <a class="nav-link active" href="index.html">Início</a>
        <a class="nav-link" href="produtos.html">Produtos</a>
        <a class="nav-link" href="orcamento.html">Orçamento</a>
      </div>
    </div>
  </nav>

  <main class="container home-main">
    <section class="home-hero">
      <div class="home-intro">
        <h1>Bem-vindo à Cyber</h1>
        <p class="home-lead">
          Tecnologia, qualidade e praticidade para você.
          Confira nossos produtos e faça seu orçamento.
        </p>
      </div>

      <section class="content-card" aria-labelledby="titulo">
        <div class="section-heading">
          <h2 id="titulo">Verificador de idade</h2>
          <p>Informe seus dados para verificar sua maioridade.</p>
        </div>

        <form id="formulario">
          <div class="mb-3">
            <label for="nome" class="form-label">Seu nome</label>
            <input
              type="text"
              id="nome"
              class="form-control"
              placeholder="Ex.: Maria Silva"
              autocomplete="name"
              required
            >
          </div>

          <div class="mb-3">
            <label for="idade" class="form-label">Sua idade</label>
            <input
              type="number"
              id="idade"
              class="form-control"
              placeholder="Digite sua idade"
              min="0"
              step="1"
              required
            >
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Verificar minha idade
          </button>
        </form>

        <div
          id="resultado"
          class="alert d-none mt-3"
          role="status"
          aria-live="polite"
        ></div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Cyber — Todos os direitos reservados.</p>
    </div>
  </footer>
</body>
</html>
