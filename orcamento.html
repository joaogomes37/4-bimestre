<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechFix — Simulador de Orçamento</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="stlye.css" />
  </head>
  <body>
  <main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <h1 class="h3 mb-3">Simulador de Orçamento</h1>

          <form id="formulario" novalidate>

            <div class="mb-3">
              <label for="nome" class="form-label">
                Nome do cliente
              </label>
              <input
                type="text"
                id="nome"
                class="form-control"
                required
              >
            </div>

            <div class="mb-3">
              <label for="servico" class="form-label">
                Serviço
              </label>
              <select id="servico" class="form-select" required>
                <option value="formatacao">Formatação — R$ 120,00</option>
                <option value="limpeza">Limpeza — R$ 80,00</option>
                <option value="instalacao">Instalação — R$ 50,00</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="quantidade" class="form-label">
                Quantidade
              </label>
              <input
                type="number"
                id="quantidade"
                class="form-control"
                min="1"
                step="1"
                required
              >
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Calcular orçamento
            </button>
          </form>

          <div id="resultado" class="alert d-none mt-3" role="alert"></div>

        </div>
      </div>

    </div>
  </div>
</main>
   
    <script src="orcamento.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
