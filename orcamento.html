<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber — Simulador de Orçamento</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="stlye.css" />
  </head>
  <body>
  <nav class="navbar navbar-expand-md bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Cyber</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="produtos.html">Produtos</a>
        <a class="nav-link active" href="orcamento.html" aria-current="page">
          Orçamento
        </a>
      </div>
    </div>
  </nav>

  <main class="container budget-main">
    <header class="budget-heading">
      <h1>Simule seu orçamento</h1>
      <p>Escolha um produto e informe a quantidade para calcular o valor total.</p>
    </header>

    <div class="budget-layout">
      <section class="budget-card" aria-labelledby="budget-form-title">
        <div class="budget-card-heading">
          <h2 id="budget-form-title">Dados do orçamento</h2>
        </div>

        <form id="formulario" novalidate>
          <div class="mb-3">
            <label for="nome" class="form-label">Nome do cliente</label>
            <input type="text" id="nome" class="form-control" placeholder="Como podemos te chamar?" autocomplete="name" required />
          </div>

          <div class="mb-3">
            <label for="produto" class="form-label">Produto</label>
            <select id="produto" class="form-select" required>
              <option value="" selected disabled>Selecione um produto</option>
              <option value="notebook">Notebook IdeaPad 3 — R$ 2.799,00</option>
              <option value="mouse">Mouse Gamer RGB — R$ 129,90</option>
              <option value="teclado">Teclado Mecânico — R$ 249,90</option>
              <option value="headset">Headset com Microfone — R$ 189,90</option>
              <option value="ssd">SSD 480 GB — R$ 530,00</option>
              <option value="memoria">Memória RAM 8 GB — R$ 329,90</option>
              <option value="roteador">Roteador Wi-Fi — R$ 219,90</option>
              <option value="mochila">Mochila para Notebook — R$ 159,90</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="quantidade" class="form-label">Quantidade</label>
            <input type="number" id="quantidade" class="form-control" placeholder="Ex.: 1" min="1" step="1" inputmode="numeric" required />
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Calcular orçamento
          </button>
        </form>

        <div id="resultado" class="alert d-none mt-3" role="status" aria-live="polite"></div>
      </section>

    </div>

    <p class="budget-disclaimer">Os preços são valores de referência.</p>
  </main>
   
    <script src="orcamento.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
