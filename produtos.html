
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confira o catálogo de produtos da Cyber.">
  <title>Cyber — Produtos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="stlye.css">
  <script src="produtos.js" defer></script>
</head>

<body>
  <nav class="navbar navbar-expand-md">
    <div class="container">
      <a class="navbar-brand" href="index.html">Cyber</a>

      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link active" href="produtos.html">Produtos</a>
        <a class="nav-link" href="orcamento.html">Orçamento</a>
      </div>
    </div>
  </nav>

  <main class="container catalog-main">
    <header class="catalog-heading">
      <h1>Catálogo de produtos</h1>
      <p>
        Confira nossos acessórios, computadores e componentes.
      </p>
    </header>

    <section class="filter-section" aria-label="Pesquisar produtos">
      <div class="row g-3">
        <div class="col-12 col-md-7">
          <label for="pesquisa" class="form-label">
            Pesquisar produto
          </label>
          <input
            type="search"
            id="pesquisa"
            class="form-control"
            placeholder="Digite o nome do produto..."
          >
        </div>

        <div class="col-12 col-md-5">
          <label for="categoria" class="form-label">
            Filtrar por categoria
          </label>
          <select id="categoria" class="form-select">
            <option value="todos">Todas as categorias</option>
            <option value="Computadores">Computadores</option>
            <option value="Acessórios">Acessórios</option>
            <option value="Áudio">Áudio</option>
            <option value="Armazenamento">Armazenamento</option>
            <option value="Componentes">Componentes</option>
            <option value="Conectividade">Conectividade</option>
            <option value="Monitores">Monitores</option>
            <option value="Impressoras">Impressoras</option>
          </select>
        </div>
      </div>
    </section>

    <p id="contador" class="catalog-counter" aria-live="polite"></p>

    <section aria-label="Produtos disponíveis">
      <div id="listaProdutos" class="row g-4"></div>

      <p id="mensagemVazia" class="alert alert-warning d-none mt-4">
        Nenhum produto encontrado.
      </p>
    </section>

    <p class="catalog-note">
      Valores apresentados para fins de demonstração e sujeitos a alteração.
    </p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Cyber — Todos os direitos reservados.</p>
    </div>
  </footer>
</body>
</html>
